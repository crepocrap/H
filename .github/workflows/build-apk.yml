
name: Build PixelCut Aero APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PixelCut Aero APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/PixelCut_Aero_Android_v2.zip"
          DEST="$RUNNER_TEMP/pixelcut-source"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::ZIP file not found in repository root"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          mkdir -p "$DEST"
          unzip -oq "$ARCHIVE" -d "$DEST"

          SETTINGS=$(find "$DEST" -type f \
            -name settings.gradle -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle not found"
            find "$DEST" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "::error::Root build.gradle not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::app/build.gradle not found"
            exit 1
          fi

          if ! grep -q "8.7.3" "$PROJECT_DIR/build.gradle"; then
            echo "::error::Expected Android Gradle Plugin 8.7.3"
            cat "$PROJECT_DIR/build.gradle"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project verified:"
          echo "$PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: ""

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "Building PixelCut Aero..."
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            :app:assembleDebug \
            --stacktrace

      - name: Verify APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated"
            find "$PROJECT_DIR" -path "*/build/outputs/*" -type f
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelCut-Aero-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
